# dm2-tool 中文术语别名（策展源）
#
# 作用：让 `dm2 knowledge search` 支持中文召回。DoDAF 数据字典的 definition 与
# aliases 全部是英文，因此中文查询在加入本文件之前恒为 0 命中。
#
# 血统说明：
#   - `dm2-reference/dm2-data-dictionary.yaml` 来自 DoDAF 标准，保持其英文原样
#   - 本文件是 dm2 策展的中文叠加层，**不改变**标准条目；术语名（键）必须已存在于
#     数据字典，构建脚本 `scripts/build_knowledge_indexes.py` 会逐键校验
#   - 别名只影响召回与排序，不构成权威定义；某条译名不妥时直接改这里并重跑构建
#
# 撰写约定：
#   - 实体优先采用 DM2/DoDAF 中文文献通行译名（Performer→执行者、Capability→能力）
#   - `*Type` 是幂类型（powertype），译作「…类型」；`*TypeType` 是「…类型的类型」
#   - 关联（association）按 CamelCase 语义直译（activityPartOfCapability→活动属于能力）
#   - 每术语 1–4 条：主译名 + 必要近义词；不塞宽泛词，避免污染排序

version: 1

# 17 个数据组的中文别名。术语会从它所属的数据组继承这些别名作为检索线索，
# 因此「资源流」「组织结构」这类**组级**查询也能召回组内术语（DM2 没有
# ResourceFlow 这个术语——它是数据组，不是实体）。
groups:
  00-foundation: [基础, 基础层]
  01-performer: [执行者, 主体]
  02-activity: [活动]
  03-capability: [能力]
  04-resource: [资源]
  05-guidance: [指导, 指南]
  06-measure: [度量, 指标]
  07-location: [位置, 地理]
  08-services: [服务]
  09-project: [项目]
  10-rules: [规则]
  11-resource-flow: [资源流, 资源流动]
  12-pedigree: [溯源, 血统]
  13-information-pedigree: [信息溯源]
  14-org-structure: [组织结构, 组织]
  15-reification: [实体化, 具体化]
  16-information-data: [信息与数据, 信息数据]

