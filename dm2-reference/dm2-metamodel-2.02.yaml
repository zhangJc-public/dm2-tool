metadata:
  schema_version: '1.0'
  file_structure:
    convention: two-section
    description: '每个子模型按 IDEAS 本体论两区组织。classes 定义"有什么东西"（含 Individual/Type/Tuple 三种基本 Thing），relations 定义"类型层级和结构关系"（UML 层面的连线）。Tuple 实例合并入 classes 区（通过 ideas_type: Tuple 区分），其辐射出边记录在 couples 字段中。 '
    sections:
    - key: classes
      contains: Individual, Type, Tuple, Powertype, TupleType, IndividualType
      role: 分类器和实体 — 定义领域内"有什么东西"，含 Tuple 关系实体
      stereotype_hint:
      - <<Individual>>
      - <<Type>>
      - <<tuple>>
      - <<Powertype>>
      - <<TupleType>>
      - <<IndividualType>>
      use_in_downstream: 建表 / 建类 / 实体识别 / 领域对象定义 / 关系推理
    - key: relations
      contains: super-subtype, powertypeInstance, typeInstance 等 UML 连线
      role: 类型层级 — 定义"类型之间什么关系"，描述类型继承和实例化(这个不对！)
      stereotype_hint:
      - <<super-subtype>>
      - <<powertypeInstance>>
      - <<typeInstance>>
      use_in_downstream: 继承链 / 类型层次 / 图连线渲染
    couples_policy: couples 是 Tuple 框辐射出的所有边，支持 3 种 uml_metaclass： NavigableAssociation（普通 place 参与者耦合）、 Generalization（superSubtype 超类关系）、 Dependency（powertypeInstance / typeInstance 关系）。 不得将 Generalization/Dependency
      边从 couples 中移到 relations。 role 字段仅对 NavigableAssociation couple 有值，为 IDEAS place 位置角色标签（如 <<place1Type>>、<<part>>、<<before>>），由 TupleType 预定义； Generalization / Dependency couple 的 role 为空字符串，其关系类型由 relations
      和 uml_metaclass 字段表达。       role 字段语法：单一 IDEAS place 位置角色标签时为 <<place1Type>>（如 <<part>>、<<whole>>、<<before>>）；当 couple 同时携带 PNG 原图连线上标注的领域语义标签时，role 字段以「|」分隔，格式为 <<位置role>>|领域语义（如 <<place1Type>>|consumer、 <<part>>|partType）。 此时位置角色与领域语义并列存在，互不取代。       multiplicityParticipant / multiplicityInverse 字段为可选 UML 端点多重度，仅当原图中关联端点明确标注数字或星号（如 1、*、2..*）时填写，图中无标注则省略：multiplicityParticipant 为 participant 端（被指向端）多重度，表示该位置可绑定的实例数量；multiplicityInverse
      为 owner/tuple 端（源端）反向多重度，表示一个 participant 实例可同时出现在多少个该关系中。 navigability 为可选 UML 关联导航性字段，仅对 NavigableAssociation couple 有值，描述关联的导航方向（箭头朝向），取值：outgoing（Tuple → Participant，默认，可省略，与现有数据兼容）、incoming（Participant
      → Tuple，用于表达外部参与者指向 Tuple 的关联）、bidirectional（双向导航）、none（无导航，原图仅画直线无箭头）。 navigability 与 role 是两个独立维度：role（<<place1Type>>、<<place2Type>>、<<part>>、<<whole>> 等）标识参与者占据的端点位置，navigability 标识箭头朝向，二者互不蕴含——place2
      端既可以是箭头终点（outgoing 指向），也可以是箭头起点（incoming 指向）。
    relation_naming: relation ID 命名规则：{prefix}:{sourceLabel}{Suffix}Of{targetLabel}。其中 {prefix} 为子模型命名空间（如 ffa:、cp:、ideas:、dodaf:、perf:、nd:）；{sourceLabel} 为 source 类的 label （首字母小写，camelCase）；{targetLabel}
      为 target 类的 label（首字母大写，camelCase）；{Suffix} 由 stereotype 决定：<<super-subtype>> → SubtypeOf、<<powertypeInstance>> → PowertypeInstanceOf、<<typeInstance>> → InstanceOf / TypeInstanceOf。 示例：ffa:coupleTypeSubtypeOfTupleType、cp:individualSubtypeOfThing、perf:organizationSubtypeOfPerformer。
    class_naming: 'class ID 命名规则：{namespace}:{label}。其中 {namespace} 由概念的归属域决定（ideas: 或 dodaf:），区分的是概念归属而非子模型；{label} 为数据字典中的标准术语（首字母大写，camelCase 保持原样）。

      ideas: 用于 IDEAS Foundation 核心概念（跨子模型复用），包括 Thing、Individual、Type、Powertype、 IndividualType 等 Class，以及 IDEAS 基础 Tuple（tuple、couple、wholePart、overlaps、beforeAfter、 superSubType、typeInstance、powertypeInstance）和各
      Powertype 的类型（TupleType、CoupleType、 WholePartType、OverlapType、BeforeAfterType、TemporalWholePartType、TemporalBoundaryType、 StartBoundaryType、EndBoundaryType 等）。

      dodaf: 用于 DM2 数据组（data_group）特有概念，包括 Performer、Resource、Activity、Information、Name、 Representation、Address、Capability、Condition、DesiredEffect、LocationType、Materiel、Measure、 MeasureType、ProjectType、Rule、Service、Skill、Vision
      等各类 Type/Individual/Tuple 实例。

      注意：一个子模型可混合使用两种前缀（如 naming_and_description 同时有 ideas:Thing 和 dodaf:Name）。 ffa:、cp:、perf:、nd: 等前缀仅用于 relation ID，不用于 class ID。'
    cross_section_references:
    - pattern: relations.source → classes
      meaning: 关系源端指向 classes 中的实体
      example: cp:individualSubtypeOfThing.source 指向 classes 区的 ideas:Individual
      count: 全文件
    - pattern: classes 中 Tuple 的 couples[].participant → classes
      meaning: Tuple 的 participants 指向 classes 中的其他实体
      example: ideas:tuple.couples[0].participant → classes 区的 ideas:Thing
      count: 每个 Tuple 的每个 couple
    - pattern: couples[] 的 multiplicityParticipant / multiplicityInverse
      meaning: UML Association 端点多重度（图中明确标注时填写）
      example: 'multiplicityParticipant: "1"、multiplicityInverse: "*"'
      count: 图中关联端点有数字/星号标注的 couple
    - pattern: couples[] 的 navigability
      meaning: UML Association 导航方向（箭头朝向），仅 NavigableAssociation couple 可填；outgoing 为默认省略值
      example: 'navigability: outgoing / incoming / bidirectional / none'
      count: 需要区分箭头朝向的 NavigableAssociation couple
  dodaf_version: '2.02'
  ideas_profile_version: '1.0'
  source: DoDAF 2.02 DM2 LDM — All Data Groups
  generated: '2026-07-03'
  data_dictionary_source:
    name: DoDAF 2.02 DM2 Data Dictionary
    worksheets:
    - entities
    - relationships
    note: element.description 和 xls_term 字段来源于此
  verification:
    color_sampling:
      date: '2026-07-03'
      method: 像素级颜色采样 + tesseract OCR
      result: pass
      note: 18 张 DM2 图全部完成 stereotype 颜色验证
    ideas_type_stereotype_consistency:
      date: '2026-07-03'
      result: pass
      note: 所有 element 的 ideas_type 与 stereotype 列表对应关系一致
    relation_type_constraint:
      date: '2026-07-03'
      result: pass
      note: 所有 relation 的 uml_type 与 stereotype 组合符合 schema §5.1 约束
    tuple_couples_completeness:
      date: '2026-07-03'
      result: pass
      note: 238 个 <<tuple>> element 全部有 2 个 couples
    couple_role_completeness:
      date: '2026-07-03'
      result: pass
      note: 476 个 couple 条目全部有 role 标签，覆盖 6 种 TupleType 的 role 映射
    super_subtype_chain:
      date: '2026-07-03'
      result: pass
      note: 12 个含 Rule 的子模型均有 Rule→Guidance 链路；performer 全部 11 个 tuple 均有 super-subtype 关系
  inference_notes:
    italic_supertypes:
      method: 从 UML 元素框右上角斜体文本推断 super-subtype 关系
      scope: 全部 18 张图，共补充 16 条 <<super-subtype>> relation
      examples:
      - Rule→Guidance
      - Skill→Property
      - Measure→Property
      - Agreement→Rule
    tupletype_inference:
      method: 通过 tuple 名称模式匹配推断 TupleType（infer_tupletype_v2）
      scope: 238 个 tuple 全部推断完成
      patterns:
      - partof→WholePart
      - locationtype→WholePartType
      - consumes/produces→BeforeAfter
      - measureof→MeasureOfType
      - propertyof→PropertyOfType
      - default→OverlapType
    role_assignment:
      method: 基于 TupleType 分配 IDEAS role 标签到 NavigableAssociation couple； Generalization / Dependency couple 的 role 留空，关系类型由 relations 和 uml_metaclass 字段表达
      mapping: OverlapType→place1Type/place2Type, WholePart→part/whole, WholePartType→partType/wholePartType, MeasureOfType→measureOfType/place1Type, PropertyOfType→propertyOfType/place1Type, BeforeAfter→before/after
    ruleConstraintsActivity:
      method: 类比同类型 activity tuple 推断为 OverlapType
      scope: performer 子模型 1 条 super-subtype 关系
  uml_profile:
    principle: 'UML 工具被 IDEAS Profile 扩展为本体工具。 未经 IDEAS 构造型标注的 UML 元素不属于本本体。 构造型是简写——标注 <<Individual>> 意味着该元素是 Individual 的一个实例。 '
    element_stereotypes:
      <<Individual>>:
        ideas_type: Individual
        uml_metaclass: Class
        fill_color: '#282828'
        description: 有时空延展的实例（something with spatio-temporal extent）
      <<Type>>:
        ideas_type: Type
        uml_metaclass: Class
        fill_color: '#99CCFF'
        description: Type 的规格说明
      <<IndividualType>>:
        ideas_type: IndividualType
        uml_metaclass: Class
        fill_color: '#FFAD5B'
        description: 成员为 Individual 的 Type
      <<TupleType>>:
        ideas_type: TupleType
        uml_metaclass: Class
        fill_color: '#CCFFCC'
        description: 成员为 tuple 的 Type
      <<Powertype>>:
        ideas_type: Powertype
        uml_metaclass: Class
        fill_color: '#CC99FF'
        description: 某个 Type 的幂集（所有子集的集合）
      <<Name>>:
        ideas_type: Name
        uml_metaclass: Class
        fill_color: '#FFFEB9'
        description: 名称的规格说明，示例文本作为 tagged value
      <<NamingScheme>>:
        ideas_type: NamingScheme
        uml_metaclass: Class
        fill_color: '#FFFF00'
        description: 成员为 name 的 Type
      <<tuple>>:
        ideas_type: Tuple
        uml_metaclass: Class
        fill_color: '#CCFFCC'
        description: 'DM2 业务关联（n-ary relationship）。 在图中渲染为浅绿色类框，框内含 lowerCamelCase 名称。 通过 couples 字段描述连接的参与者，每条 couple 是一条 <<couple>> Association 线。 每个 tuple 有且仅有 2 个 couples。 '
    relation_stereotypes:
      <<super-subtype>>:
        uml_metaclass: Generalization
        line_style: 实线
        arrowhead: 空心三角
        color: '#0000FF'
        description: 类型与其子类型之间的关系
      <<wholePart>>:
        uml_metaclass: Aggregation
        line_style: 实线
        arrowhead: 空心菱形
        color: '#009300'
        description: 个体与其组成部分之间的关系
      <<typeInstance>>:
        uml_metaclass: Dependency
        line_style: 虚线
        arrowhead: 箭头
        color: '#FF0000'
        description: 类型与其实例之间的关系
      <<powertypeInstance>>:
        uml_metaclass: Dependency
        line_style: 虚线
        arrowhead: 箭头
        color: '#FF0000'
        description: 类型与其幂集之间的关系
      <<nameTypeInstance>>:
        uml_metaclass: Dependency
        line_style: 虚线
        arrowhead: 箭头
        color: '#FF0000'
        description: 名称与其 NameType 之间的关系
      <<couple>>:
        uml_metaclass: Navigable Association
        line_style: 实线
        arrowhead: 开放箭头（从 tuple 框指向 participant）
        color: '#282828'
        description: 从 <<tuple>> 框到参与者的连线。UML Navigable Association，箭头方向 表示 tuple 对参与者的引用/辐射方向。不独立出现，仅作为 tuple element 的 couples 字段存在。每条 couple 带 participant（目标元素 id）和 role 字段。 role 仅对 NavigableAssociation
          couple 有值，为 IDEAS place 位置角色标签（如 <<place1Type>>、<<part>>）； Generalization / Dependency couple 的 role 为空，关系类型由 relations 和 uml_metaclass 字段表达。couples 列表顺序对应图中连线的空间位置 （couples[0] 通常在左/上方）。
    type_hierarchy:
      description: IDEAS Foundation 的 super-subtype 层级
      levels:
      - ideas:Type → 子类包括 IndividualType, TupleType, Powertype
      - Individual → 通过 <<typeInstance>> 关联到 IndividualType
      - Tuple (<<tuple>>) → 通过 <<super-subtype>> 关联到 TupleType
      note: 'Foundational classes（Type、Individual、super-subtype、whole-part、overlap、 type-instance、before-after 等模式）通常不在数据组图中显示， 见 IDEAS Foundation ontology。 '
    tuple_type_role_mapping:
      description: TupleType 决定 couples 的 role 标签
      mappings:
        OverlapType:
          roles:
          - <<place1Type>>
          - <<place2Type>>
          semantics: '两个参与者的重叠关系。place1Type/place2Type 有序不可互换， 对应图中从 tuple 框辐射出的两条有向线（Navigable Association）。 Foundation 层 tuple 使用语义化 role 替代（如 subtype/supertype、 instance/type），见 schema §3.3.2(B)。 '
        WholePart:
          roles:
          - <<part>>
          - <<whole>>
          semantics: 部分与整体的关系
        WholePartType:
          roles:
          - <<partType>>
          - <<wholePartType>>
          semantics: 部分类型与整体类型的关系
        MeasureOfType:
          roles:
          - <<measureOfType>>
          - <<place1Type>>
          semantics: 度量与被度量类型的关系
        PropertyOfType:
          roles:
          - <<propertyOfType>>
          - <<place1Type>>
          semantics: 属性与被属性类型的关系
        BeforeAfter:
          roles:
          - <<before>>
          - <<after>>
          semantics: 前后时序关系
    visual_conventions:
      italic_supertypes: '为避免线条交叉，超类关系以斜体文本列在 UML 元素框右上角， 而非绘制泛化线。在 YAML 中映射为 <<super-subtype>> relation， note 字段标注 "inferred from italic"。'
      naming: '类名首字母大写；关联名和属性名首字母小写（camelCase）； 缩写全大写。'
      icon_size: 图标大小不表示重要性，仅为减少线条交叉和弯曲
      couple_directionality: '所有 tuple→participant 的连线均为 UML Navigable Association（带箭头实线）， 箭头从 tuple 框指向 participant。IDEAS Profile 定义为 n-ary relationship diamond， 但 DM2 实际图中统一采用辐射式有向线画法。role 标签（place1Type/place2Type
        等）的顺序与 couples 列表一一对应，不可随意交换。'
      semantic_labels: '某些业务 tuple 在连线上额外标注了领域语义标签（如 consumer、producer、partType、wholeType、before、after）。 这些标签现已合并到 YAML couples 结构的 role 字段中，与 IDEAS place 位置角色标签以「|」分隔，格式为 <<位置role>>|领域语义（如 <<place1Type>>|consumer、 <<part>>|partType）。 无领域语义时 role 仅为 <<位置role>> 单标签。 典型例子：activityConsumesResource(Activity端=consumer)、 activityProducesResource(Activity端=producer)、jointAction(左=consumer,
        右=producer)。'
submodels:
  performer:
    diagram: performer.png
    data_group: Performer
    note: 执行者（人员/组织/系统/服务）
    verified: '2026-07-11'
    structure: two-section
    classes:
    - id: dodaf:Performer
      label: Performer
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: An entity that performs an activity. Types of Performer include Person, Organization, System, and Service.
      ideas_type: Powertype
      xls_term: Performer
      xls_source: entities
    - id: dodaf:Resource
      label: Resource
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: An entity that can be used or consumed during an activity.
      ideas_type: Powertype
      xls_term: Resource
      xls_source: entities
    - id: dodaf:Materiel
      label: Materiel
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: Equipment, apparatus or supplies that are of interest, without distinction as to its application for administrative or combat purposes.
      ideas_type: Type
      xls_term: Materiele
    - id: dodaf:LocationType
      label: LocationType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A type of location where resources can be placed or activities performed.
      ideas_type: Powertype
      xls_term: LocationType
      xls_source: entities
    - id: dodaf:Activity
      label: Activity
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A function, task, or operation that is performed by a Performer.
      ideas_type: Powertype
      xls_term: Activity
      xls_source: entities
    - id: dodaf:PersonRoleType
      label: PersonRoleType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A role that a Person can perform. When a Person Type is part of another Person Type, that Person Type refers to a role within a Person Type.
      ideas_type: Powertype
      xls_term: PersonRoleType
      xls_source: entities
    - id: dodaf:OrganizationType
      label: OrganizationType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A powertype whose instances are specific types of organizations (e.g., Joint Force, Brigade).
      ideas_type: Powertype
      xls_term: OrganizationType
      xls_source: entities
    - id: dodaf:System
      label: System
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A functionally, physically, and/or behaviorally related group of regularly interacting or interdependent independent elements.
      ideas_type: Type
      xls_term: System
      xls_source: entities
      note: A subtype of Performer
    - id: dodaf:Service
      label: Service
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A mechanism to enable access to one or more capabilities through a prescribed interface.
      ideas_type: Type
      xls_term: Service
      xls_source: entities
      note: A subtype of Performer
    - id: dodaf:Condition
      label: Condition
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A state or situation that affects the performance of an activity.
      ideas_type: Type
      xls_term: Condition
      xls_source: entities
    - id: dodaf:Skill
      label: Skill
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A capability or proficiency that can be possessed by a PersonRoleType.
      ideas_type: Type
      xls_term: Skill
      xls_source: entities
      note: A Property type
    - id: dodaf:Rule
      label: Rule
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A principle or condition that governs the behavior of an activity.
      ideas_type: Type
      xls_term: Rule
      xls_source: entities
      note: A Guidance type
    - id: dodaf:Agreement
      label: Agreement
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A formal understanding between parties.
      ideas_type: Type
      xls_term: Agreement
      xls_source: entities
    - id: dodaf:Measure
      label: Measure
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A measurement or metric that can be associated with an entity.
      ideas_type: Type
      xls_term: Measure
      xls_source: entities
      note: 'Has property +numericValue : string'
    - id: dodaf:MeasureableSkill
      label: MeasureableSkill
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A skill that can be measured.
      ideas_type: Type
      xls_term: MeasureableSkill
      xls_source: entities
    - id: dodaf:Organization
      label: Organization
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<IndividualType>>
      description: A specific real-world organization. A powertype instance of OrganizationType.
      ideas_type: IndividualType
      xls_term: Organization
      xls_source: entities
    - id: dodaf:IndividualPersonRole
      label: IndividualPersonRole
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<IndividualType>>
      description: A specific person occupying a specific role. A powertype instance of PersonRoleType.
      ideas_type: IndividualType
      xls_term: IndividualPersonRole
      xls_source: entities
    - id: dodaf:IndividualResource
      label: IndividualResource
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<IndividualType>>
      description: A specific instance of a Resource. A powertype instance of Resource.
      ideas_type: IndividualType
      xls_term: IndividualResource
      xls_source: entities
    - id: dodaf:IndividualPerformer
      label: IndividualPerformer
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<IndividualType>>
      description: A specific thing that can perform an action. A specific instance of a Performer. A powertype instance of Performer.
      ideas_type: IndividualType
    - id: dodaf:OverlapType
      label: OverlapType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<TupleType>>
      description: A TupleType for relationships that represent an overlap between two or more entities.
      ideas_type: TupleType
      xls_term: OverlapType
      xls_source: entities
    - id: dodaf:wholePart
      label: WholePart
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<TupleType>>
      description: A TupleType for relationships where one entity is a constituent part of another.
      ideas_type: WholePartType
      xls_term: WholePart
      xls_source: entities
    - id: dodaf:measureOfType
      label: measureOfType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<TupleType>>
      description: A TupleType for relationships that associate a Measure with an entity of a given type.
      ideas_type: TupleType
      xls_term: measureOfType
      xls_source: entities
    - id: dodaf:propertyOfType
      label: propertyOfType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<TupleType>>
      description: A TupleType for relationships that associate a Property with an entity type.
      ideas_type: TupleType
      xls_term: propertyOfType
      xls_source: entities
    - id: dodaf:Property
      label: Property
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A property type — supertype of Skill and other property-like types
      ideas_type: Type
