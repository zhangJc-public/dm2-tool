  naming_and_description:
    diagram: Naming and Description Pattern.png
    data_group: Naming and Description
    note: '命名与描述模式 — Name/NamingScheme/Representation/Information 的关系。 依据 Naming and Description Pattern.png 源图逐元素校订。 已按两区结构重组：classes(21) + relations(13)。 couples 共 20 条：14 NavigableAssociation + 6 Generalization。
      couples 支持 3 种 uml_metaclass：NavigableAssociation / Generalization / Dependency。 2026-07-11 重新校订：修正 Name/Sign stereotype、role 互换、补充 6 条 Generalization couple + 4 条 relation。 Representation 类含属性 exemplar:
      variant。 2026-07-12 用户校订：relations 从 10 条增至 13 条，修正继承层级（Representation→SignType、 Information→Representation、Name→Representation），新增 DescriptionScheme→Information、 RepresentationScheme→RepresentationType、ArchitecturalDescription→Information、
      SecurityAttributesGroup→Information 等 super-subtype 关系。

      '
    verified: '2026-07-12'
    structure: two-section
    classes:
    - id: dodaf:Thing
      label: Thing
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: The top-level supertype
      ideas_type: Type
    - id: dodaf:Representation
      label: Representation
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A representation of a thing
      ideas_type: Type
      attributes:
      - name: exemplar
        type: variant
    - id: dodaf:Information
      label: Information
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: Information that describes a thing
      ideas_type: Type
    - id: dodaf:Name
      label: Name
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A name for a thing (a subtype of Information)
      ideas_type: Type
    - id: dodaf:RepresentationScheme
      label: RepresentationScheme
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A representation scheme
      ideas_type: Type
    - id: dodaf:NamingScheme
      label: NamingScheme
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A naming scheme
      ideas_type: Type
    - id: dodaf:DescriptionScheme
      label: DescriptionScheme
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A description scheme
      ideas_type: Type
    - id: dodaf:ArchitecturalDescription
      label: ArchitecturalDescription
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: An architectural description
      ideas_type: Type
    - id: dodaf:SecurityAttributesGroup
      label: SecurityAttributesGroup
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: Security attributes group
      ideas_type: Type
    - id: dodaf:SignType
      label: SignType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A sign type
      ideas_type: Powertype
    - id: dodaf:RepresentationType
      label: RepresentationType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A representation type
      ideas_type: Powertype
    - id: dodaf:NameType
      label: NameType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A name type
      ideas_type: Powertype
    - id: dodaf:InformationType
      label: InformationType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: An information type
      ideas_type: Powertype
    - id: dodaf:Sign
      label: Sign
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<IndividualType>>
      description: A sign individual type (powertypeInstance of SignType)
      ideas_type: IndividualType
    - id: dodaf:representedBy
      label: representedBy
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A thing is represented by a representation (subtype of couple)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Thing
        role: <<place1Type>>|represented-entity
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Representation
        role: <<place2Type>>|Representation
        uml_metaclass: NavigableAssociation
      - participant: dodaf:couple
        uml_metaclass: Generalization
    - id: dodaf:describedBy
      label: describedBy
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A thing is described by information (subtype of tuple, NOT couple)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Thing
        role: <<place1Type>>|described-entity
        uml_metaclass: NavigableAssociation
