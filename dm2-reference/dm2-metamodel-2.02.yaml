  ideas_toplevel:
    diagram: IDEAS TopLeve.png
    data_group: IDEAS Foundation
    note: 'IDEAS TopLevel: fundamental ontic categories defined by the IDEAS Model. Based on BORO and ISO15926.'
    verified: '2026-07-05'
    structure: two-section
    couples_policy: 'couples 支持 3 种 uml_metaclass：NavigableAssociation（普通 place 耦合）、 Generalization（superSubtype 超类关系）、Dependency（powertypeInstance）。 Tuple 框辐射出的所有边均属于 couples。

      '
    classes:
    - id: dodaf:Thing
      label: Thing
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: The union of Individual, Type, and Tuple. Root class of the IDEAS upper level.
      ideas_type: Type
      xls_term: Thing
      xls_source: entities
    - id: dodaf:Individual
      label: Individual
      uml_metaclass: Class
      stereotype:
      - <<Individual>>
      description: A Thing that has spatio-temporal extent.
      ideas_type: Individual
      xls_term: Individual
      xls_source: entities
    - id: dodaf:Type
      label: Type
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A set (or class) of Things.
      ideas_type: Type
      xls_term: Type
      xls_source: entities
    - id: dodaf:IndividualType
      label: IndividualType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<IndividualType>>
      description: The powertype of Individual.
      ideas_type: IndividualType
      xls_term: IndividualType
      xls_source: entities
    - id: dodaf:Powertype
      label: Powertype
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A Type that is the powerType of some other Type.
      ideas_type: Powertype
      xls_term: Powertype
      xls_source: entities
    - id: dodaf:TupleType
      label: TupleType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<TupleType>>
      description: A Type whose instances are Tuples.
      ideas_type: TupleType
      xls_term: TupleType
      xls_source: relationships
    - id: dodaf:Tuple
      label: tuple（元组）
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: An ordered relationship (tuple) between two Things.
      ideas_type: Tuple
      xls_term: tuple
      xls_source: relationships
      couples:
      - participant: dodaf:Thing
        role: <<placeType>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Thing
        uml_metaclass: Generalization
      - participant: dodaf:TupleType
        uml_metaclass: Dependency
    relations:
    - id: ideas:individualSubtypeOfThing
      description: Individual is a subtype of Thing.
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:Individual
      target: dodaf:Thing
    - id: ideas:typeSubtypeOfThing
      description: Type is a subtype of Thing.
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:Type
      target: dodaf:Thing
    - id: ideas:individualTypeSubtypeOfType
      description: IndividualType is a subtype of Type.
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:IndividualType
      target: dodaf:Type
    - id: ideas:powertypeSubtypeOfType
      description: Powertype is a subtype of Type.
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:Powertype
      target: dodaf:Type
    - id: dodaf:tupleTypeSubtypeOfType
      description: TupleType is a subtype of Type.
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:TupleType
      target: dodaf:Type
    - id: ideas:individualPowertypeInstanceOfIndividualType
      description: Individual is a powertype instance of IndividualType.
      uml_metaclass: Dependency
      stereotype: <<powertypeInstance>>
      source: dodaf:Individual
      target: dodaf:IndividualType
    - id: ideas:individualTypeInstanceOfPowertype
      description: IndividualType is a type instance of Powertype.
      uml_metaclass: Dependency
      stereotype: <<typeInstance>>
      source: dodaf:IndividualType
      target: dodaf:Powertype
    - id: dodaf:tupleTypeInstanceOfPowertype
      description: TupleType is a type instance of Powertype.
      uml_metaclass: Dependency
      stereotype: <<typeInstance>>
      source: dodaf:TupleType
      target: dodaf:Powertype
  common_patterns:
    diagram: Common Patterns.png
    data_group: Common Patterns
    note: 'IDEAS 常见模式 — Individual/Type/Tuple 三种基本 Thing 及其关系。 依据 Common Patterns.png 源图逐元素校订。 已按两区结构重组：classes(20) + relations(18)。 couples 支持 3 种 uml_metaclass：NavigableAssociation / Generalization /
      Dependency。

      '
    verified: '2026-07-05'
    structure: two-section
    couples_policy: 'couples 支持 3 种 uml_metaclass：NavigableAssociation（普通 place 耦合）、 Generalization（superSubtype 超类关系）、Dependency（powertypeInstance）。 Tuple 框辐射出的所有边均属于 couples，不再按 uml_metaclass 分流到 relations。

      '
    classes:
    - id: dodaf:Thing
      label: Thing
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: The top-level supertype — union of Individual, Type, and Tuple
      ideas_type: Type
    - id: dodaf:Type
      label: Type
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      description: A category of things
      ideas_type: Type
    - id: dodaf:Individual
      label: Individual
      uml_metaclass: Class
      stereotype:
      - <<Individual>>
      description: A particular thing — has spatio-temporal extent
      ideas_type: Individual
    - id: dodaf:tuple
      label: tuple（元组）
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: An ordered relationship between Things — has two place positions
      ideas_type: Tuple
      couples:
      - participant: dodaf:Thing
        role: <<place1Type>>
        uml_metaclass: NavigableAssociation
        note: cardinality 2..* (图中标注 places <<place1Type>> {subsets} places 2..*)
      - participant: dodaf:Thing
        role: <<place2Type>>
        uml_metaclass: NavigableAssociation
        note: cardinality * (图中标注 places <<place2Type>> places *)
      - participant: dodaf:Thing
        uml_metaclass: Generalization
        note: tuple ⊂ Thing — IDEAS 本体超类关系（图中空心三角箭头）
      - participant: dodaf:TupleType
        uml_metaclass: Dependency
        note: tuple 是 TupleType 的 powertype 实例（图中虚线箭头 <<IDEAS:powertypeInstance>>）
    - id: dodaf:couple
      label: couple
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A couple connects a tuple to its participants
      ideas_type: Tuple
      couples:
      - participant: dodaf:tuple
        role: <<place1Type>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Thing
        role: <<place2Type>>
        uml_metaclass: NavigableAssociation
        note: 图中标注 {subsets} places
    - id: dodaf:wholePart
      label: wholePart
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A whole-part relationship between Individuals (mereologic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Individual
        role: <<part>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Individual
        role: <<whole>>
        uml_metaclass: NavigableAssociation
    - id: dodaf:typeInstance
      label: typeInstance
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: An instantiation relationship from Individual to Type (set-theoretic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Individual
        role: <<instance>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Type
        role: <<type>>
        uml_metaclass: NavigableAssociation
    - id: dodaf:superSubType
      label: superSubtype
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A generalization (super-subtype) relationship (set-theoretic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Type
        role: <<subtype>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Type
        role: <<supertype>>
        uml_metaclass: NavigableAssociation
    - id: dodaf:overlap
      label: overlap
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: An overlap between Individuals (4D topologic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Individual
        role: <<place1Type>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Individual
        role: <<place2Type>>
        uml_metaclass: NavigableAssociation
        note: cardinality 2..* (图中 overlap 框右侧标注 2..*)
    - id: dodaf:powertypeInstance
      label: powertypeInstance
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A powertype instantiation from Individual to Type (set-theoretic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Individual
        role: <<powertypeInstance>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Type
        role: <<powertype>>
        uml_metaclass: NavigableAssociation
        note: 图中 powertype 端连接到 Type 区域(无独立 Powertype 框)
      - participant: dodaf:IndividualType
        uml_metaclass: Dependency
        note: powertypeInstance 是 IndividualType 的 powertype 实例（图中虚线箭头 <<IDEAS:powertypeInstance>>）
    - id: dodaf:beforeAfter
      label: beforeAfter
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A temporal before-after relationship between Individuals (4D topologic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Individual
        role: <<place1Type>>|before
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Individual
        role: <<place2Type>>|after
        uml_metaclass: NavigableAssociation
    - id: dodaf:temporalWholePart
      label: temporalWholePart
      uml_metaclass: Class
      stereotype:
      - <<tuple>>
      description: A temporal whole-part relationship between Individuals (mereologic)
      ideas_type: Tuple
      couples:
      - participant: dodaf:Individual
        role: <<temporalWhole>>
        uml_metaclass: NavigableAssociation
      - participant: dodaf:Individual
        role: <<temporalPart>>
        uml_metaclass: NavigableAssociation
    - id: dodaf:OverlapType
      label: OverlapType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<TupleType>>
      description: The powertype of overlaps
      ideas_type: Powertype
    - id: dodaf:WholePartType
      label: WholePartType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<TupleType>>
      description: The powertype of whole-part relationships
      ideas_type: Powertype
      couples:
      - participant: dodaf:IndividualType
        role: <<place1Type>>|wholeType
        uml_metaclass: NavigableAssociation
      - participant: dodaf:IndividualType
        role: <<place2Type>>|partType
        uml_metaclass: NavigableAssociation
    - id: dodaf:CoupleType
      label: CoupleType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<TupleType>>
      description: The powertype of couples
      ideas_type: Powertype
    - id: dodaf:TupleType
      label: TupleType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<TupleType>>
      description: The powertype of tuples
      ideas_type: Powertype
    - id: dodaf:BeforeAfterType
      label: BeforeAfterType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<TupleType>>
      description: The powertype of before-after relationships
      ideas_type: Powertype
      couples:
      - participant: dodaf:IndividualType
        role: <<place1Type>>|beforeType
        uml_metaclass: NavigableAssociation
      - participant: dodaf:IndividualType
        role: <<place2Type>>|afterType
        uml_metaclass: NavigableAssociation
    - id: dodaf:TemporalWholePartType
      label: TemporalWholePartType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<TupleType>>
      description: The powertype of temporal whole-part relationships
      ideas_type: Powertype
    - id: dodaf:IndividualType
      label: IndividualType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      - <<IndividualType>>
      description: The powertype of individual types
      ideas_type: IndividualType
    - id: dodaf:SingletonIndividualType
      label: SingletonIndividualType
      uml_metaclass: Class
      stereotype:
      - <<Type>>
      - <<Powertype>>
      description: A type with exactly one instance
      ideas_type: Powertype
    relations:
    - id: cp:individualSubtypeOfThing
      description: Individual is a subtype of Thing
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:Individual
      target: dodaf:Thing
    - id: cp:typeSubtypeOfThing
      description: Type is a subtype of Thing
      uml_metaclass: Generalization
      stereotype: <<super-subtype>>
      source: dodaf:Type
