  foundation_for_associations:
    diagram: Foundation For Associations.png
    data_group: Foundation For Associations
    note: "Foundation For Associations — DM2 的 Association 字典。\n本子模型定义所有关系元类型的继承树 + IDEAS 三基础关系 + 业务 Tuple 实例化。\n原图将以下三层画在一张图中，保持原图完整性不做物理拆分:\n\n1. IDEAS 基础元类型层（对应数据字典 ideas-foundation 标注）:\n   TupleType\
      \ → CoupleType → {WholePartType, BeforeAfterType, OverlapType}\n   WholePartType → TemporalWholePartType → TemporalBoundaryType → {EndBoundaryType, StartBoundaryType}\n   三基础关系: superSubType / typeInstance\
      \ / powertypeInstance\n\n2. DM2 扩展关系类型层（对应数据字典 dm2-foundation 标注）:\n   measureOfType / propertyOfType / describedBy / representedBy 等基础关系类型\n\n3. 业务 Tuple 层（跨业务共享的关系类型实例化）:\n   activityConsumesResource\
      \ / measureOfTypeActivity 等，数据字典中标注归属各业务子模型\n\n工具层区分方式: 查询 dm2-data-dictionary.yaml 中该类的 submodels 字段，\nideas-foundation=x 或 dm2-foundation=x 即为字典层，否则为业务 Tuple 层。"
    verified: '2026-07-20'
    structure: two-section
    classes:
