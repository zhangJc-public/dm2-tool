- id: dodaf:Rule
  term: Rule
  definition: A principle or condition that governs behavior; a prescribed guide for conduct or action
  status: a. In Model
  association: false
  source_definitions: "(BMM Concept Catalog):  Business Rules provide specific, actionable guidance to implement Business\
    \ Policies. Some Business Rules could be automated in software; some are actionable only by people.\n‘Business Rule’ participates\
    \ in the following associations:\n• is derived from Business Policy\n• may guide Business Processes\n• may have an enforcement\
    \ level effected by a Tactic.  ‘Business Rule’ in version 1.2 of the BMM is adopted from SBVR.\n(dictionary.com): a principle\
    \ or regulation governing conduct, action, procedure, arrangement, etc.;  the customary or normal circumstance, occurrence,\
