- id: dodaf:Measure
  term: Measure
  definition: The magnitude of some attribute of an individual.
  status: a. In Model
  association: false
  source_definitions: "(DoDAF/CADM):  N/A\n(JC3IEDM):  ObjectItemCapabilityNorm: The standard of a specific Capability of\
    \ an ObjectType.\n(Webster's):  the extent, dimensions, quantity, etc., of something\n(Wikipedia, \"Measurement\"):  the\
    \ estimation of the magnitude of some attribute of an object\n(Software Engineering Institute (SEI)):  Need Satisfaction\
    \ (QM.1) How well does the system meet the user's needs and requirements? Performance (QM.2) How well does the system\
    \ function? Maintenance (QM.3) How easily can the system be repaired or changed? Adaptive (QM.4) How easily can the system\
    \ evolve or migrate? Organizational (QM.5) none specifically, usually indirect \n(IDEAS):  An Property whose members are\
    \ Individuals that all share a common, measurable property, or whose properties lie within a MeasureRange."
  comments: '"Attribute" is probably more usual language than "Capability" and magnitude avoids overloading of "standard".'
