- id: dodaf:Resource
  term: Resource
  definition: Data, Information, Performers, Materiel, or Personnel Types that are produced or consumed.
  status: a. In Model
  association: false
  source_definitions: 'OASIS SOA RA: Message exchange is the means by which service participants (or their agents) interact
    with each other. There are two primary modes of interaction: joint actions that cause real world effects, and notification
    of events that report real world effects.   A message exchange is used to affect an action when the messages contain the
    appropriately formatted content that should be interpreted as joint action and the agents involved interpret the message
    appropriately.  A message exchange is also used to communicate event notifications.  An event is a report of an occurrence
    that is of interest to some participant; in our case when some real world effect has occurred. Just as action messages
    will have formatting requirements, so will event notification messages.  In this way, the Information Model of a service
    must specify the syntax (structure), and semantics (meaning) of the action messages and event notification messages as
    part of a service interface.  It must also specify the syntax and semantics of any data that is carried as part of a payload
    of the action or event notification message.  The Information Model is described in greater detail in the Service Description
    Model (see Section 4.1).'
