    \ support); others describe the immediate joint operations area (e.g., maritime superiority), while still others describe\
    \ the battlefield conditions (e.g., littoral composition).  Not to be confused with \"condition\" as it applies to triggers,\
    \ e.g., in state transition models\n(WordNet) A state at a particular time"
