- id: dodaf:System
  term: System
  definition: A functionally, physically, and/or behaviorally related group of regularly interacting or interdependent elements.
  status: a. In Model
  association: false
  source_definitions: "(DoDAF):  Any organized assembly of resources and procedures united and regulated by interaction or\
    \ interdependence to accomplish a set of specific functions.\n(DoDAF/CADM):  An organized assembly of interactive components\
    \ and procedures forming a unit.(DDDS Counter (19607/1)(A))\n(MODAF):  Any organised assembly of resources and procedures\
    \ united and regulated by interaction or interdependence to accomplish a set of specific functions.\n(IEEE):  A collection\
    \ of components organized to accomplish a specific function or set of functions.\n(BEA):  Any organized assembly of resources\
    \ and procedures united and regulated by interaction or interdependence to accomplish a set of specific functions.\n(NAF):\
    \  A collection of components organized to accomplish a specific function or set of functions. (GEN TERM)\n(NAF):  A coherent\
    \ combination of physical artifacts, energy and information, assembled for a purpose. (MM)\n(JCS 1-02):  A functionally,\
    \ physically, and/or behaviorally related group of regularly interacting or interdependent elements; that group of elements\
    \ forming a unified whole. (JP 3-0)\n(Zachman):  A MECHANISM TYPE that consists of one of more linked computers, along\
    \ with associated software.\n(Webster's):  1. An assemblage or combination of things or parts forming a complex or unitary\
    \ whole.   2. Any assemblage or set of correlated members.  3. An ordered and comprehensive assemblage of facts, principles,\
    \ doctrines, or the like in a particular field of knowledge or thought.  4. A coordinated body of methods or a scheme\
    \ or plan of procedure; organizational scheme. 5. Any formulated, regular, or special method or plan of procedure ocedure;\
    \ organizational scheme. 5. Any formulated, regular, or special method or plan of procedure \n(INCOSE)  A system is a\
    \ construct or collection of different elements that together produce results not obtainable by the elements alone. The\
    \ elements, or parts, can include people, hardware, software, facilities, policies, and documents; that is, all things\
    \ required to produce systems-level results. The results include system level qualities, properties, characteristics,\
    \ functions, behavior and performance. The value added by the system as a whole, beyond that contributed independently\
    \ by the parts, is primarily created by the relationship among the parts; that is, how they are interconnected (Rechtin,\
    \ 2000). \n(WordNet):  \n(Gene Bellinger):  A system is an entity that maintains its existence through the mutual interaction\
    \ of its parts."
  comments: 'JP 1-02 is most authoritative.


    Agree we can use "system" for now; suggest we''re going to need the other two Real Quick.'
  examples: weapon system, UAV, GCSS, JOPES, GSORTS, GTN, any specific DCGS
