- id: dodaf:Site
  term: Site
  definition: 'Physical (geographic) location that is or was owned by, leased to, or otherwise possessed. Each site is assigned
    to a single installation. A site may exist in one of three forms: (1) Land only, where there are no facilities present
    and where the land consists of either a single land parcel or two or more contiguous land parcels. (2)  Facility or facilities
    only, where the underlying land is neither owned nor controlled by the government. A stand-alone facility can be a site.
    If a facility is not a stand-alone facility, it must be assigned to a site. (3). Land and all the facilities thereon,
    where the land consists of either a single land parcel or two or more contiguous land parcels.'
  status: a. In Model
  association: false
  source_definitions: '(DODI 4165.14):  Physical (geographic) location that is or was owned by, leased to, or otherwise possessed
    by a DoD Component. Each site is assigned to a single installation. A site may exist in one of three forms: (1) Land only,
    where there are no facilities present and where the land consists of either a single land parcel or two or more contiguous
    land parcels. (2)  Facility or facilities only, where the underlying land is neither owned nor controlled by the government.
    A stand-alone facility can be a site. If a facility is not a stand-alone facility, it must be assigned to a site. (3).
    Land and all the facilities thereon, where the land consists of either a single land parcel or two or more contiguous
    land parcels.'
  comments: Regulation (DODI 4165.14)
  cdm_level: Y
