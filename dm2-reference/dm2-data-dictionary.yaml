- id: dodaf:Capability
  term: Capability
  definition: The ability to achieve a Desired Effect under specified [performance] standards and conditions through combinations
    of ways and means [activities and resources] to perform a set of activities.
  status: a. In Model
  association: false
  source_definitions: "(JCIDS):  The ability to achieve a desired effect under specified standards and conditions through\
    \ combinations of means and ways to perform a set of tasks.\n(DoDAF/CADM):  An ability to achieve an objective. (DDDS\
    \ Counter (333/1)(A))\n(JC3IEDM):  The potential ability to do work, perform a function or mission, achieve an objective,\
    \ or provide a service.\n(MODAF):  Capabilities in the MODAF sense are specifically not about equipment but are a high\
    \ level specification of the enterprise’s ability. A capability is a classification of some ability – and can be specified\
    \ regardless of whether the enterprise is currently able to achieve it. For example, one could define a capability “Manned\
    \ Interplanetary Travel” which no-one can currently achieve, but which may be planned or aspired to. Capabilities in MODAF\
    \ are not time-dependent – once defined they are persistent. It is only the Capability Requirement that changes.\n(NAF):\
    \  The ability of one or more resources to deliver a specified type of effect or a specified course of action. (GEN TERM)\n\
    (NAF):  A high level specification of the enterprise's ability. (MM)\n(JCS 1-02):  The ability to execute a specified\
    \ course of action. (A capability may or may not be accompanied by an intention.)\n(Webster's):  1. The quality of being\
    \ capable; ability.  2. A talent or ability that has potential for development or use.  3. The capacity to be used, treated,\
    \ or developed for a specific purpose.\n(Merriam-Webster's Eleventh Collegiate Dictionary): A feature or factor capable\
    \ of development: POTENTIALITY.    3. The facility or potential for an indicated use or deployment.\n(Joint Publication\
    \ 1-02, Dictionary of Military and Associated Terms, 12 Apr 2001 (as amended trhough 30 May 2008) ): The ability to exercise\
    \ a specified course of action (A capability may or may not be accompanied by an intention)\n(Dictionary.com): The quality\
    \ of being capable; capacity; ability: His capability was unquestionable. The ability to undergo or be affected by a given\
    \ treatment or action: the capability of glass in resisting heat. Usually, capabilities. qualities, abilities, features,\
    \ etc., that can be used or developed; potential: Though dilapidated, the house has great capabilities \n(Wiktionary):\
    \ The power or ability to generate an outcome\n(www.staffordshireprepared.gov.uk/glossary/): Originally a military term\
    \ which includes the aspects of personnel, equipment, training, planning and operational doctrine. Now used to mean a\
    \ demonstrable capacity or ability to respond to and recover from a particular threat or hazard."
  comments: 'Authority: "The Secretary of Defense, by DOD Directive 5025.12, 23 August 1989, Standardization of Military and
    Associated Terminology, has directed the use of JP 1-02 throughout the Department of Defense to ensure standardization
    of military and associated terms.'
  examples: '"The soldier shall be able to load and fire his individual weapon." (JP 1-02) "The soldier shall be able to load
    and fire his individual weapon from (positions) on a trainfire range, in (weather) to achieve a minimum score of "Marksman"
    on the Army Marksm'
