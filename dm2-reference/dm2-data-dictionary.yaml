- id: dodaf:ServiceDescription
  term: ServiceDescription
  definition: Information necessary to interact with the service in such terms as the service inputs, outputs, and associated
    semantics. The service description also conveys what is accomplished when the service is invoked and the conditions for
    using the service.
  aliases:
  - Service Interface Description (UPDM)
  status: a. In Model
  association: false
  source_definitions: 'DoDAF: The set of descriptive metadata that provides a consistent way to describe the use, composition,
    and implementation of a service to service providers, users, developers, and managers.  a specification for metadata about
    a service

    OASIS SOA RM: Contains the information necessary to interact with the service and describes this in such terms as the
    service inputs, outputs, and associated semantics. The service description also conveys what is accomplished when the
    service is invoked and the conditions for using the service.

    OASIS SOA Ref Arch: A service description is an artifact, usually document-based, that defines or references the information
    needed to use, deploy, manage and otherwise control a service. This includes not only the information and behavior models
    associated with a service to define the service interface but also includes information needed to decide whether the service
    is appropriate for the current needs of the service consumer. Thus, the service description will also include information
    such as service reachability, service functionality, and the policies and contracts associated with a service.'
  cdm_level: Y
  who: FD / CY / KL
