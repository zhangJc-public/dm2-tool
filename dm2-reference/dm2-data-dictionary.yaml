- id: dodaf:Service
  term: Service
  definition: A mechanism to enable access to a set of one or more capabilities , where the access is provided using a prescribed
    interface and is exercised consistent with constraints and policies as specified by the service description.  The mechanism
    is a Performer.  The "capabilities" accessed are Resources -- Information, Data, Materiel, Performers, and Geo-political
    Extents.
  status: a. In Model
  association: false
  source_definitions: "(Net-Centric Services Strategy, 3/2007): a mechanism to enable access to one or more capabilities,\
    \ where the access is provided using a prescribed interface and is exercised consistent with constraints and policies\
    \ as specified by the service description.\n(OASIS SOA RM): A mechanism to enable access to a set of one or more capabilities,\
    \ where the access is provided using a prescribed interface and is exercised consistent with constraints and policies\
    \ as specified by the service description.\n(Wordnet): Work done by one person or group that benefits another; \"budget\
    \ separately for goods and services\" \n(The Free On-line Dictionary of Computing):  Work performed (or offered) by a\
    \ server. This may mean simply serving simple requests for data to be sent or stored (as with file servers, gopher or\
    \ http servers, e-mail servers, finger servers, SQL servers, etc.); or it may be more complex work, such as that of irc\
    \ servers, print servers, X Windows servers, or process servers.  E.g. \"Access to the finger service is restricted to\
    \ the local subnet, for security reasons\".\n(http://www.ibm.com/developerworks/xml/library/ws-support-soa/ ):  Service-Oriented\
    \ Architecture (SOA) introduces a highly distributed architecture which assumes multiple consumers executing the same\
    \ service. In such systems, different consumers can have different quality of service (QoS) requirements for the invocation\
    \ of the same service. Additionally, new versions of services can be introduced over time, which might require correct\
    \ routing of requests from different consumers to particular service versions. All of these requirements can be collectively\
    \ described as service invocation policies. These policies can be either managed separately or incorporated into the service’s\
    \ definitions.\"\n(Mark Lankhorst, et. al., Archimate Language Primer, Telematica Institut, the Netherlands, p 4.):  A\
    \ service is defined as a unit of functionality that some entity (e.g., a system, organization or department) makes available\
    \ to its environment and which has some value to certain entities in the environment."
  comments: 'Used to say:  "Activities done by a service provider (performer) to achieve desired results for a service consumer
    (other performer) under conditions and standards specified in a service contract"


    The way DM reads NCSS def emphasis on "mechanism to enable access to" vice actually providing the activities, QoS, etc.  In
    the garbage pickup service, the service would then be the ordering of, contract with, etc. for the service.  The garbage
    pickup would be the capability accessed.'
  cdm_level: YY
