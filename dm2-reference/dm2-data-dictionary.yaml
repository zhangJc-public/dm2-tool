- id: dodaf:Standard
  term: Standard
  definition: A formal agreement documenting generally accepted specifications or criteria for products, processes, procedures,
    policies, systems, and/or personnel.
  status: a. In Model
  association: false
  source_definitions: '(DoDAF/CADM):  InformationTechnologyStandard: An Agreement for a procedure, product or relationship
    for the acquisition, storage, manipulation, management, movement, control, switching, interchange, transmission or reception
    or data.

    (see Metrics)

    (FEA):  A set of criteria (some of which may be mandatory), voluntary guidelines, and best practices. Examples include:

    • Application development

    • Project management

    • Vendor management

    • Production operation

    • User support

    • Asset management

    • Technology evaluation

    • Architecture governance

    • Configuration management

    • Problem resolution.

    (NAF):  A ratified and peer-reviewed specification that is used to guide or constrain the architecture. A <<Standard>>
    may be applied to any element in the architecture via the [constrainedItem] property of UML::Constraint. (MM)

    (Webster''s):  1. Something considered by an authority or by general consent as a basis of comparison; an approved model.  2.
    A rule or principle that is used as a basis for judgment.  3. An average or normal requirement, quality, quantity, level,
    grade, etc.  4. An authoritative principle or rule that usually implies a model or pattern for guidance, by comparison
    with which the quantity, excellence, correctness, etc., of other things may be determined. Synonyms: gauge, basis,

    pattern, guide. Standard, criterion refer to the basis for making a judgment. A criterion is a rule or principle used
    to judge the value, suitability, probability, etc., of something, without necessarily

    implying any comparison.

    (American Heritage Dictionary): an acknowledged measure of comparison for quantitative

    or qualitative value; criterion.

    (ISE-FS-200):  A specific technical methodology and practice.

    (ANSI):  A formal agreement documenting generally accepted specifications or criteria for products, processes, procedures,
    policies, systems, and/or personnel.

    (ISO):  An ISO standard is a documented agreement containing technical specifications or other precise criteria to be
    used consistently as rules, guidelines, or definitions of characteristics to ensure that materials, products, processes
    and services are fit for their purpose. It is a living agreement that can have a profound influence on things that deserve
    to be taken seriously - such as the safety, reliability and efficiency of machinery and tools, means of transport, toys,
    medical devices, and so on.'
  cdm_level: YY
