- id: dodaf:Location
  term: Location
  definition: A point or extent in space that may be referred to physically or logically.
  status: a. In Model
  association: false
  source_definitions: '(JC3IEDM) A specification of position and geometry with respect to a specified horizontal frame of
    reference and a vertical distance measured from a specified datum.

    (UCORE)  A position on the earth’s surface or in geographic space definable by coordinates or some other referencing system,
    such as a street address or space indexing system.

    (WordNet) A point or extent in space'
  comments: 'WordNet better matches requirements than UCORE because:  (1) the positions may reference other than earth, e.g.,
    for solar activity models for comms environment predications and (2) often extents are intended to be represented, not
    just positions.'
