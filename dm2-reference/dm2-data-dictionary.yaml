- id: dodaf:Materiel
  term: Materiel
  definition: Equipment, apparatus or supplies that are of interest, without distinction as to its application for administrative
    or combat purposes.
  status: a. In Model
  association: false
  source_definitions: '(DoDAF/CADM):  An object of interest that is non-human, mobile and physical.  (DDDS Counter (337/1)(A))

    (JC3IEDM):  An ObjectItem that is equipment, apparatus or supplies, that is of military interest, without distinction
    as to its application for administrative or combat purposes.

    (JCS 1-02):  All items (including ships, tanks, self-propelled weapons, aircraft, etc., and related spares, repair parts,
    and support equipment, but excluding real property, installations, and utilities) necessary to equip, operate, maintain,
    and support military activities without distinction as to its application for administrative or combat purposes. See also
    equipment; personal property.

    (Webster''s):  That in a complex system which constitutes the materials, or instruments employed, in distinction from
    the personnel, or men; as, the baggage, munitions, provisions, etc., of an army.'
  comments: Derived from JC3IEDM.
  cdm_level: YY
  who: GC
