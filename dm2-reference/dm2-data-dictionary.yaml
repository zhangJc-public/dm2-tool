# DM2 Data Dictionary (Merged)
# Source: DoDAF 2.02 DM2 Data Dictionary（原始 XLS：DM2_Data_Dictionary_and_Mappings_v202.xls，已于 2026-08-26 从仓库剔除）
# Generated by: scripts/parse_dm2_xls.py（该脚本已随 XLS 一并删除，2026-08-26；需要时重写）
# Term count: 279 (173 entities + 106 relationships)
#
# Filter: status = 'a. In Model'
#
# Entities and relationships are merged into a single list in XLS row
# order. DoDAF DM2 metadata does not partition cleanly along ER-diagram
# entity/relationship lines, so the prior two-file split has been
# abandoned in favour of one authoritative data dictionary.
#
# id field:
#   CURIE of form dodaf:<term>, e.g. dodaf:Activity. Derived 1:1 from
#   the XLS term name (all term names are unique and valid identifiers),
#   so the id is stable and reproducible (term unchanged -> id unchanged).
#   Aligns with the id:dodaf:<term> convention used in dm2-metamodel-2.02.yaml
#   and supports cross-standard mapping via the ideas: namespace.
#
# Monster Matrix Legend (view_products values):
#   n   = necessary (必须包含)
#   o   = optional (可选)
#   df  = DM2 foundation - not used (DM2 基础 - 不使用)
#   dfo = DM2 foundation optionally used (DM2 基础 - 可选使用)
#   if  = IDEAS foundation - not used (IDEAS 基础 - 不使用)
#   ifo = IDEAS foundation optionally used (IDEAS 基础 - 可选使用)
#   m   = metadata (元数据)
#   s   = security (安全标记)
#   np  = XML schema class needed for naming pattern shortcut (命名模式快捷方式所需的 XML Schema 类)
#
# Submodel Legend (submodels values):
#   x   = term belongs to this submodel (术语属于此子模型)
#   (empty) = not applicable (不适用)
#
# association field:
#   true  = relationship / association (XLS "Association?" = Y/y)
#   false = plain entity (XLS "Association?" empty)
#   ER-diagram classification is NOT used to split DM2 metadata; the
#   distinction is preserved as data only.
#
# core_process_requirements (when present):
#   Numeric (1-6) Core Process Requirement level per process area.
#   XLS marks this section "in-progress, Conceptual Level draft only";
#   absent for most terms.
#
# ERD-derived entries (status = 'f. ERD-derived'):
#   Pattern-level relations/tuples present in the official DM2 LDM
#   diagrams (dm2-metamodel-2.02.yaml) but absent from the XLS data dictionary,
#   retained via the Foundation Pattern Exception (pattern diagrams may keep
#   association patterns as classes). The definition is rule-derived from the
#   IDEAS stereotype + endpoints;
#   provenance / erd_diagram / erd_stereotype / erd_endpoints / reasoning
#   preserve full traceability back to the source ERD.
#
- id: dodaf:Activity
  term: Activity
  definition: Work, not specific to a single organization, weapon system or individual that transforms inputs (Resources)
    into outputs (Resources) or changes their state.
  aliases:
  - Action
  - Process Operational Activity
  - Processes
  - Function
  - System Function
  - Operation
  - Task
  - Plan
  - Project
  status: a. In Model
  association: false
  source_definitions: "(DoDAF):  An action performed in conducting the business of an enterprise. It is a general term that\
    \ does not imply a placement in a hierarchy (e.g., it could be a process or a task as defined in other documents and it\
    \ could be at any level of the hierarchy of the OV-5). It is used to portray operational actions not hardware/software\
    \ system functions.\" \n(DoDAF/CADM):  (ProcessActivity, catCode=5) The representation of a means by which a process acts\
    \ on some input to produce a specific output. (DDDS Counter (4204/3)(A))\n(MODAF):  An action performed in conducting\
    \ the business of an enterprise. It is a general term that does not imply a placement in a hierarchy (eg, it could be\
    \ a process or a task as defined in other documents and it could be at any level of the hierarchy). It is used to portray\
    \ operational actions not hardware/software system functions. Operational Activity may include either military operations\
    \ or business processes.\"\n(NAF):  A logical process, specified independently of how the process is carried out. Note:\
    \ an <OperationalActivity>> may only be carried out by a logical <<Node>>. (MM)\n(JCS 1-02):  Activity: 1. A unit, organization,\
    \ or installation performing a function or mission, e.g.,\nreception center, redistribution center, naval station, naval\
    \ shipyard. 2. A function, mission, action, \nor collection of actions. Also called ACT. See also establishment.\n(Zachman):\
    \  Activity: A general term to decribe something that is done.  It is used when a more \nspecific definition is not available.\
    \  An ACTIVITY must be either a FUNCTION or a PROCESS.\n(American Heritage Dictionary):  Activity:  1. The state or quality\
    \ of being active.  2. A specific \ndeed, action, function, or sphere of action.  3. Any specific behavior.  4. The state\
    \ of being active.\n(Webster's):  Activity: 1. A specific function being performed by an organizational unit or system.\
    \  \n2. A pursuit in which a person or system is active."
  comments: Confirm that defs and structures align.  Derived from a commonality among candidate definitions, with emphasis
    on MODAF and Webster's Dictionary.
  cdm_level: YY
  who: GC
