  - Tactic
  - Strategy
  - Activity
  status: a. In Model
  association: false
  source_definitions: "(Project Management Institute, A Guide to the Project Management Body of Knowledge (PMBOK), 3rd edition\
    \ 2004):  A Project is a temporary endeavor undertaken to create a unique product, service, or result. \n(DoDAF/CADM):\
    \  A planned action that represents a set of activities organized and managed to produce a specified product in a specified\
    \ period of time with specified resources. (DDDS Counter (19607/1)(A))\n(NAF):  A time-limited endeavour to create a specific\
    \ set of products or services. (MM).\n(Webster's):  1. Something that is contemplated, devised, or planned; plan; scheme.\
    \  2. A large or major undertaking, esp. one involving considerable money, personnel, and equipment."
