- id: dodaf:Data
  term: Data
  definition: Representation of information in a formalized manner suitable for communication, interpretation, or processing
    by humans or by automatic means. Examples could be whole models, packages, entities, attributes, classes, domain values,
    enumeration values, records, tables, rows, columns, and fields.
  status: a. In Model
  association: false
  source_definitions: '(NAF):  A reinterpretable representation of information in a formalized manner suitable for communication,
    interpretation, or processing. Note: Data can be processed by humans or by automatic means (GEN TERM)

    (JCS 1-02 / NECC):  Representation of facts, concepts, or instructions in a formalized manner suitable for communication,
    interpretation, or processing by humans or by automatic means. Any representations such as characters or analog quantities
    to which meaning is or might be assigned.

    (Zachman):  The column in the Architecture Framework that is concerned with what things are significant enough to an enterprise
    that they require holding information about them.

    (American Heritage Dictionary.):  Factual information, especially information organized for analysis or used to reason
    or make decisions.

    (Webster''s):  Factual information (as measurements or statistics) used as a basis for reasoning, discussion, or calculation

    (DoD Net-Centric Data Strategy, App. A (Terminology), May 2003): Data asset refers to any entity that is composed of data.
    For example, a database is a data asset that comprises data records. In this document, “data asset” means system or application
    output files, databases, documents, or web pages. “Data asset” also includes services that may be provided to access data
    from an application. For example, a service that returns individual records from a database would be a data asset. Similarly,
    a website that returns data in response to specific queries (e.g., weather.com) would be a data asset. The core of the
    net-centric environment is the data that enables effective decisions. In this context, data implies all data assets such
    as system files, databases, documents, official electronic records, images, audio files, web sites, and data access services.'
  comments: e.g., target 123 report.  Derived from a commonality among candidate definitions, with emphasis on NAF, JCS 1-02,
    and the American Heritage and Webster's dictionaries.
  examples: '1. "These data represent the results of our analyses."

    2. "Data are entered by terminal for immediate processing by the computer."

    3. "Additional data is unavailable."'
