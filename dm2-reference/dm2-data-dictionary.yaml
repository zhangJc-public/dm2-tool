- id: dodaf:Information
  term: Information
  definition: Information is the state of a something of interest that is materialized -- in any medium or form -- and communicated
    or received.
  status: a. In Model
  association: false
  source_definitions: '(DoDAF/CADM):  InformationElement: A formalized representation of data subject to a functional process.(DDDS
    Counter (4199/2)(A))

    (NAF):  The knowledge concerning objects, such as facts, events, things, processes or ideas including concepts that within
    a certain context have a particular meaning. (GEN TERM)

    (JCS 1-02):  1. Facts, data, or instructions in any medium or form. 2. The meaning that a human assigns to data by means
    of the known conventions used in their representation. (JP 3-13.1)

    (IDEAS):  For Individuals, an instance of a piece of information - e.g. an utterance, and electronic message, a particular
    instance of a written document, or a particular instance of an electronic file.

    (American Heritage Dictionary.):  1. Knowledge communicated or received concerning a particular fact or circumstance.  2.
    Factual data.

    (Webster''s):  1. The communication or reception of knowledge or intelligence.  2. Knowledge obtained from investigation,
    study, or instruction.

    (Wikipedia):  Information is the state of a system of interest. Message is the information materialized.  Even though
    information and data are often used interchangeably, they are actually very different. Data is a set of unrelated information,
    and as such is of no use until it is properly evaluated. Upon evaluation, once there is some significant relation between
    data, and they show some relevance, then they are converted into information. Now this same data can be used for different
    purposes. Thus, till the data convey some information, they are not useful.'
  comments: Derived from a commonality among candidate definitions, with emphasis on IDEAS and Webster's Dictionary.
  examples: '1. "Information concerning a crime."

    2. "Using the input data, we have come up with some significant new information."'
