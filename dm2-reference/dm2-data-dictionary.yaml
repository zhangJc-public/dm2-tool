- id: dodaf:Organization
  term: Organization
  definition: A specific real-world assemblage of people and other resources organized for an on-going purpose.
  aliases:
  - Department
  - Agency
  - Enterprise
  status: a. In Model
  association: false
  source_definitions: '(DoDAF/CADM):  An administrative structure with a mission. (DDDS Counter (345/1)(A))

    (JC3IEDM):  An ObjectItem that is an administrative or functional structure.

    (NAF):  ActualOrganization: An actual specific organisation, an instance of an organisation class - e.g. "The US Department
    of Defense" (MM)

    (Zachman):  A collection of people brought together for a specific purpose and generally recognized as such.

    (IDEAS): No definition yet, possibilities are: (1) An agreement amongst parties to act as a whole; (2) A structure for
    arranging and classifying; (3) the process of obscuring information to make it unreadable without special knowledge.

    (Webster''s):  1. A group of persons organized for some end or work; association. 2. Something that has been organized
    or made into an ordered whole.  3. The administrative personnel or apparatus of a business.'
  comments: To be of interest to architecture, an organization should not be temporary or structured informally.
  examples: DoD, a human resources office, a rifle squad, General Motors
