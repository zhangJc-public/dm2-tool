- id: dodaf:Facility
  term: Facility
  definition: 'A real property entity consisting of underlying land and one or more of the following: a building, a structure
    (including linear structures), a utility system, or pavement.'
  status: a. In Model
  association: false
  source_definitions: "(DoDAF/CADM):  Real property, having a specified use, that is built or maintained by people.  (DDDS\
    \ Counter (334/1)(A)). \n(JC3IEDM):  An ObjectItem that built, installed or established to served some particular purpose\
    \ and is identified by the service it provides rather than by its content.\n(NAF):  Physical Asset: A <<Resource>> that\
    \ can host systems and/or people. Note 1: synonyms for <<PhysicalAsset>>; would be \"platform\", \"facility\", or \"host\"\
    . This is the original intent for the SystemsNode\" concept in DoDAF. (MM)\n(JCS 1-02):  A real property entity consisting\
    \ of one or more of the following: a building, a structure, a utility system, pavement, and underlying land. See also\
    \ air facility.\n(Webster's):  1. Something designed, built, installed, etc., to serve a specific function affording a\
    \ convenience or service.  2. Something that permits the easier performance of an action, course of conduct, etc.\n(DoDI\
    \ 4165.14):  A building, structure, or linear structure out to an imaginary line surrounding a facility at a distance\
    \ of five feet from the foundation that, barring specific direction to the contrary such as a utility privatization agreement,\
    \ denotes what is included in the basic record for the facility (e.g., landscaping, sidewalks, utility connections). This\
    \ imaginary line is what is commonly referred to as the “five-foot line.”"
  comments: DDDS + JCS + 4165
  cdm_level: Y
  who: DM
