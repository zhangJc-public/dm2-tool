# dm2-tool 数据元 / 限定词词表（GB/T 18391 · ISO/IEC 11179 对象类 + 特性 + 表示）
#
# 作用：把 DM2 术语名按「数据元 + 限定词 + 组合语法」结构化，从而
#   1) 由词表确定性地组合出规范中文名（替代逐条手写 279 条别名）；
#   2) 支撑检索侧的词元归一与查询分解（P2/P3）；
#   3) 新术语若由既有词元组成即可自动命名，否则构建失败要求登记词元。
#
# 血统：本文件是 dm2 策展的**模型层**，不改动 DoDAF 数据字典；
#       中文别名（dm2-term-zh-aliases.yaml）保留为显示/同义词层，二者对账。
#
# 三类条目：
#   elements   — 对象类（数据元的名词部分）
#   qualifiers — 限定词：结构词（of/type/instance/by…）与关系谓词（consumes/part…）
#   templates  — 组合语法：connectors 是必须连续出现的词元串，
#                {A} = 连接词之前的词元串，{B} = 之后的词元串，两者递归组合
#
# 组合顺序：先取**最长** connectors 匹配的模板，槽位递归；无模板命中时按
#           elements/qualifiers 逐词元拼接；最后应用结构规则
#           （结尾 `type type` → 「{前缀}的类型」；结尾 `type` → 「{前缀}类型」）。
#
# 强约束：术语名分解出的每个词元都必须登记在 elements 或 qualifiers 中，
#         且只能登记一次；未登记词元会让构建失败（不允许静默降级）。

version: 1

