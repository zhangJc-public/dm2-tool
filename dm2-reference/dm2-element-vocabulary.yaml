  feature: 要素
  extent: 范围
  functional: 功能
  technical: 技术
  architectural: 架构
  organizational: 组织
  adaptability: 适应性
  maintainability: 可维护性
  measureable: 可度量
  performance: 性能
  physical: 物理
  security: 安全
  attributes: 属性
  needs: 需求
  satisfaction: 满足度
  singleton: 单例
  real: 不动产
  world: 世界
  domain: 领域
  naming: 命名
  joint: 联合
  action: 活动
  axes: 坐标轴
  coordinate: 坐标
  center: 中心
  end: 结束
  start: 起始
  pedigree: 溯源
  port: 端口

# 复合数据元：多词元整体才是一个对象类（ISO 11179 的 object class 可以是词组）。
# 组合时在词元串中按**最长**匹配优先于逐词元拼接。
compounds:
  planar surface: 平面
  geo political: 地缘政治
  geo stationary: 地球静止
  measure of desire: 期望度量
  measure of effect: 效果度量
  region of country: 国家内区域
  region of world: 世界区域
  real property: 不动产
  position reference frame: 位置参考系
  measure type units of measure: 度量的计量单位

qualifiers:
  # 结构词
  of: 的
  type: 类型
  by: 由
  is: 是
  in: 位于
  to: 到
  under: 在…下
  an: ""
  whole: 整体
  part: 属于
  instance: 实例
  subtype: 子类型
  super: 父
  sub: 子
  powertype: 幂类型
  before: 前
  after: 后
  # 关系谓词
  consumes: 消耗
  produces: 产生
  produced: 产生
  performed: 执行
  performable: 可执行
  described: 描述
  desired: 期望
  realized: 实现
  named: 命名
  represented: 表示
  maps: 映射
  directs: 导向
  enables: 使能
  access: 访问
  constrains: 约束
  constraint: 约束
  valid: 有效
  applicable: 适用
  has: 拥有

templates:
  # ── 关系句式（按 connectors 长度降序、再按特异度排列）────────────────
  - id: is-realized-by
    connectors: [is, realized, by]
    zh: "{A}由{B}实现"
  - id: enables-access-to
    connectors: [enables, access, to]
    zh: "{A}使能{B}访问"
  - id: performable-under
    connectors: [performable, under]
    zh: "{A}可在{B}下执行"
  - id: performed-by
    connectors: [performed, by]
    zh: "{A}由{B}执行"
  - id: produced-by
    connectors: [produced, by]
    zh: "{A}由{B}产生"
  - id: valid-under
    connectors: [valid, under]
    zh: "{A}在{B}下有效"
  - id: subtype-of
    connectors: [subtype, of]
    zh: "{A}是{B}的子类型"
  - id: powertype-instance-of
    connectors: [powertype, instance, of]
    zh: "{A}是{B}的幂类型实例"
  - id: type-instance-of
    connectors: [type, instance, of]
    zh: "{A}是{B}的类型实例"
  - id: part-of
    connectors: [part, of]
    zh: "{A}属于{B}"
  - id: described-by
    connectors: [described, by]
    zh: "{A}由描述"
  - id: named-by
    connectors: [named, by]
    zh: "{A}由{B}命名"
  - id: represented-by
    connectors: [represented, by]
    zh: "{A}由表示"
  - id: maps-to
    connectors: [maps, to]
    zh: "{A}映射到{B}"
  - id: applicable-to
    connectors: [applicable, to]
    zh: "{A}适用于{B}"
  - id: parties-to-an
    connectors: [parties, to, an]
    zh: "{B}参与方"
  - id: scheme-instance
    connectors: [scheme, instance]
    zh: "{A}方案实例"
  - id: whole-part
    connectors: [whole, part]
    zh: "{A}整体部分"
  - id: super-sub-type
    connectors: [super, sub, type]
    zh: 上下位类型
  - id: before-after
    connectors: [before, after]
    zh: "{A}前后"
  - id: before-after-type
    connectors: [before, after, type]
    zh: 前后关系类型
  - id: couple-type
    connectors: [couple, type]
    zh: 耦合关系类型
  - id: overlap-type
    connectors: [overlap, type]
    zh: 重叠关系类型
  - id: powertype-instance
    connectors: [powertype, instance]
    zh: "{A}幂类型实例"
  - id: type-instance
    connectors: [type, instance]
    zh: "{A}类型实例"
  - id: joint-action
    connectors: [joint, action]
    zh: 联合活动
  - id: consumes
    connectors: [consumes]
    zh: "{A}消耗{B}"
  - id: produces
    connectors: [produces]
    zh: "{A}产生{B}"
  - id: constrains
    connectors: [constrains]
    zh: "{A}约束{B}"
  - id: directs
    connectors: [directs]
    zh: "{A}导向{B}"
  - id: has
    connectors: [has]
    zh: "{A}拥有{B}"
  - id: in-location
    connectors: [in]
    zh: "{A}位于{B}"
  - id: association-of
    connectors: [association, of]
    zh: "{B}的关联"
  - id: rule-constraint-of
    connectors: [rule, constraint, of]
    zh: "{B}的规则约束"
  - id: measure-of-type
    connectors: [measure, of, type]
    zh: "{B}类型的度量"
    strip_leading_type: [B]
    collapse_type: true
  - id: measure-of
    connectors: [measure, of]
    zh: "{B}的度量"
  - id: is
    connectors: [is]
    zh: "{A}是{B}"
  - id: of
    connectors: [of]
    zh: "{B}的{A}"
  - id: boundary
    connectors: [boundary]
    zh: "{A}边界"
