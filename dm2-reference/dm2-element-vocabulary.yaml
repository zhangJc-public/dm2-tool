  thing: 事物
  country: 国家
  line: 线
  point: 点
  surface: 曲面
  condition: 条件
  property: 属性
  representation: 表示
  guidance: 指导
  data: 数据
  information: 信息
  agreement: 协议
  name: 名称
  sign: 标志
  tuple: 元组
