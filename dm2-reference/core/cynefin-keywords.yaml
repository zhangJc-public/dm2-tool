# Cynefin 复杂度推导词库（v2）
#
# 三层定位：
#   1) 本文件的词表只产生「启发式预填」（prefill）与语境规则信号，不是最终判定；
#   2) dimensions.<id>.rubric 是规范评估量表（引导问题 + 三档行为锚点），
#      由在环 Agent/人按量表裁定（adjudicated）；
#   3) crisis 信号必须通过语境门控：候选词 + 窗口内门控词，且不落入排除复合词。
#
# 维度词表匹配规则（v1 保持）：
# - clear / complicated 正面词带否定前缀保护（不|未|没|无|毫|并不|尚未|难以），
#   「不确定」不会被「确定」二次命中；否定式直接列入 complex；
# - 长度优先、去重叠：长词（难以协调）覆盖短词（协调）。
# scale 节只产出规模剖面，不参与域判定。
version: 2

# ── 危机信号：语境规则 ──────────────────────────────────────────
# 候选词命中后：
#   a) 与任一 exclude 复合词跨度重叠 → excluded（规划/准备语境，留痕不沉默）；
#   b) 否则在候选跨度左右 window 个字符内找到 require_near 门控词 → fired；
#   c) 找不到门控词 → weak（提示裁定者，不触发否决）。
# direct 短语视为门控恒成立，但同样受 exclude 跨度否决。
crisis:
  signals:
    - id: response-in-progress          # 应急处置/响应进行时
      candidates: [应急处置, 应急响应, 应急指挥, 抢修]
      require_near: [正在, 中, 已启动, 已进入]
      window: 8
      exclude: [应急预案, 应急演练, 应急体系, 应急能力, 应急机制,
                应急流程, 应急规划, 应急制度, 响应流程, 响应预案,
                应急响应能力, 应急响应体系]
    - id: large-scale-outage             # 既成事实的大面积中断/宕机
      candidates: [中断, 宕机]
      require_near: [全站, 全网, 全线, 大面积, 核心系统, 核心业务, 多个关键]
      window: 6
      exclude: [中断风险, 中断处置流程, 防止中断, 防中断, 宕机风险,
                业务中断风险, 应急预案]
    - id: spreading                      # 事态蔓延进行时
      candidates: [蔓延]
      require_near: [正在, 仍在, 持续, 事态]
      window: 4
      exclude: [防止蔓延, 防蔓延]
    - id: loss-of-control                # 失控进行时/完全态
      candidates: [失控]
      require_near: [正在, 已, 完全, 濒于]
      window: 4
      exclude: [失控风险, 防止失控, 防失控]
  # 门控语义已内嵌的强短语（仍受 exclude 跨度否决）
  direct:
    - 战时状态
    - 紧急抢修中
    - major outage
    - system is down
    - ongoing emergency
    - active crisis

# 否定前缀：用于 clear / complicated 正面词的后顾断言
negation_prefixes:
  - 并不
  - 尚未
  - 难以
  - 不
  - 未
  - 没
  - 无
  - 毫

dimensions:
  # ── 需求可知性：问题空间是否已知 ──────────────────────────────
  requirement_knowability:
    rubric:
      question: "需求现在能说清吗？是冻结的、需要调研收敛的、还是在持续涌现？"
      anchors:
        clear: "需求明确且已冻结，范围不再变化"
        complicated: "部分明确，经调研或分阶段推进可以收敛"
        complex: "需求模糊或持续涌现，行动前无法完整定义"
    clear:
      - 需求明确
      - 范围明确
      - 目标明确
      - 要求明确
      - 已冻结
      - 需求冻结
      - 定义清晰
      - 明确
      - 已知
      - 确定
      - well-defined
      - requirements clear
    complicated:
      - 分阶段明确
      - 逐步明确
      - 逐步收敛
      - 部分明确
      - 需调研
      - 待调研
      - 需要澄清部分需求
      - 需求梳理
    complex:
      - 不确定
      - 不明确
      - 尚未明确
      - 未知
      - 模糊
      - 含糊
      - 涌现
      - 持续涌现
      - 持续变化
      - 探索性需求
      - 需求演变
      - 待定
      - 未定
      - tbd
      - uncertain
      - unclear
      - unknown
      - emerging requirements

  # ── 实践成熟度：解空间知识（最佳实践→专家分析→无先例）────────
  practice_maturity:
    rubric:
      question: "这类问题有现成做法吗？是照搬最佳实践、需要专家分析选型、还是业内没有先例？"
      anchors:
        clear: "有成熟方案/最佳实践，照标准实施即可"
        complicated: "需要专家分析，存在多个好答案，需选型或定制集成"
        complex: "无先例可循，只能在行动中探索有效做法"
    clear:
      - 成熟方案
      - 成熟产品
      - 标准部署
      - 标准化部署
      - 最佳实践
      - 常规交付
      - 常规实施
      - 开箱即用
      - 单一产品部署
      - mature solution
      - best practice
      - off-the-shelf
    complicated:
      - 等保
      - 等保2.0
      - 等保三级
      - 密评
      - 分级保护
      - 合规改造
      - 定制集成
      - 系统集成
      - 专家分析
      - 多方案选型
      - 方案选型
      - 专业评估
      - 架构评审
      - custom integration
      - expert analysis
    complex:
      - 业内首次
      - 行业首次
      - 尚无先例
      - 无先例
      - 没有先例
      - 前沿
      - 前沿探索
      - 自研新范式
      - 新范式
      - 探索前行
      - 探索中
      - 开创性
      - 史无前例
      - unprecedented
      - no precedent
      - cutting edge

  # ── 环境动态性：答案的时效性 ─────────────────────────────────
  environmental_dynamics:
    rubric:
      question: "外部环境变化有多快？今天的方案会不会在建成前就过期？"
      anchors:
        clear: "环境静态稳定，方案长期有效"
        complicated: "变化可预测，可按路线图/分期演进"
        complex: "快速变化或对抗演变，答案会过期，需要探针式迭代"
    clear:
      - 长期稳定
      - 稳定
      - 固定不变
      - 长期不变
      - 静态
      - stable
      - static
    complicated:
      - 可预测变化
      - 渐进演进
      - 分期建设
      - 分阶段建设
      - 逐步演进
      - 路线图清晰
      - predictable evolution
    complex:
      - 快速变化
      - 迅速变化
      - 动态
      - 自适应
      - 对抗演变
      - 持续演变
      - 瞬息万变
      - 答案会过期
      - 高速迭代
      - rapidly changing
      - dynamic
      - adaptive
      - fast-moving

  # ── 目标一致性：干系人冲突（不是干系人数量）──────────────────
  goal_alignment:
    rubric:
      question: "各方想要的是同一件事吗？是目标一致、利益可协调、还是存在根本对立？"
      anchors:
        clear: "各方接受同一目标，无实质分歧"
        complicated: "多元利益但可通过协调达成一致"
        complex: "存在根本目标冲突或立场对立，协调本身是核心难题"
    clear:
      - 目标一致
      - 各方一致
      - 统一目标
      - 意见一致
      - 共识明确
      - aligned goals
      - shared goals
    complicated:
      - 多方协调
      - 跨部门协作
      - 多方协作
      - 利益相关方协调
      - 多方配合
      - 协调各方
      - multi-stakeholder coordination
    complex:
      - 目标冲突
      - 利益冲突
      - 立场对立
      - 诉求矛盾
      - 诉求冲突
      - 难以协调
      - 不可调和
      - 互相掣肘
      - conflicting goals
      - conflict of interest

  # ── 约束清晰度：规则的一致性（不是条文数量）──────────────────
  constraint_clarity:
    rubric:
      question: "约束条件清楚且自洽吗？是完备一致、有框架需解释、还是缺失或互相矛盾？"
      anchors:
        clear: "规则/标准完备且相互一致，无合规要求也算清晰"
        complicated: "有合规框架或行业标准，但需要解释和适配"
        complex: "规则缺失、监管不明或条文相互矛盾，无章可循"
    clear:
      - 规则完备
      - 标准完备
      - 标准明确
      - 规范完备
      - 法规完备
      - 制度完备
      - 无合规要求
      - 没有合规要求
      - clear regulations
      - well-defined standards
    complicated:
      - 有合规框架
      - 合规框架
      - 行业规范
      - 行业标准
      - 需解释
      - 弹性解释
      - 标准解读
      - regulatory framework
      - industry standards
    complex:
      - 规则缺失
      - 监管缺失
      - 监管不明
      - 无章可循
      - 相互矛盾
      - 规则矛盾
      - 规范冲突
      - 政策空白
      - 监管真空
      - contradictory rules
      - unregulated

